<svg width="1600" height="400" viewBox="0 0 1600 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="MilliMindMap banner">
  <defs>
    <linearGradient id="g1" x1="0" x2="1">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="1"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="1"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" />
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="#0f172a" />
  <g transform="translate(40,40)">
    <g filter="url(#blur)">
      <circle cx="300" cy="140" r="120" fill="url(#g1)" opacity="0.18" />
      <rect x="520" y="20" width="520" height="260" rx="28" fill="#0b1220" opacity="0.06" />
    </g>

    <text x="28" y="90" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="48" font-weight="700">MilliMindMap</text>
    <text x="28" y="132" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="18">Visual budgeting & business mind-map — connect revenue, expenses, and retained earnings</text>

    <!-- stylized nodes preview -->
    <g transform="translate(520,40)">
      <rect x="0" y="0" width="220" height="110" rx="18" fill="#0b1220" stroke="rgba(255,255,255,0.06)" />
      <text x="20" y="36" fill="#a7f3d0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700">Revenue</text>
      <text x="20" y="66" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800">$12,400</text>

      <rect x="260" y="60" width="220" height="110" rx="18" fill="#0b1220" stroke="rgba(255,255,255,0.06)" />
      <text x="280" y="96" fill="#fecaca" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700">Expense</text>
      <text x="280" y="126" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800">$4,200</text>

      <path d="M220 55 C240 55, 260 75, 260 80" stroke="rgba(96,165,250,0.9)" stroke-width="4" fill="none" stroke-linecap="round" />
    </g>
  </g>
</svg>